<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>지난 조언 모음</title>
<link rel="stylesheet" href="../assets/styles/base.css">
<style>
body{display:block;max-width:560px;margin:0 auto;padding:60px 20px;background:var(--hanji);}
h1{border-bottom:2px solid var(--vermilion);padding-bottom:10px;font-size:26px;letter-spacing:.08em;}
ul{list-style:none;padding:0;margin:0;}
li{padding:12px 0;border-bottom:1px solid var(--gold);font-size:17px;display:flex;justify-content:space-between;gap:12px;align-items:baseline;}

li .who{font-size:13px;color:var(--ink-soft);white-space:nowrap;}
li .sub{font-size:14px;color:var(--ink-soft);flex:1;text-align:right;}
