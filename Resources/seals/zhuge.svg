<svg class="sage-seal-svg" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="제갈공명 낙관">
  <defs>
    <filter id="sage-stamp-texture" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G"/>
      <feComponentTransfer>
        <feFuncA type="discrete" tableValues="0 1 1 1 0 1 1 1 1"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <g transform="rotate(-4 70 70)" filter="url(#sage-stamp-texture)">
    <rect x="10" y="10" width="120" height="120" rx="4" fill="#9b2226"/>
    <rect x="10" y="10" width="120" height="120" rx="4" fill="none" stroke="#6e1418" stroke-width="4"/>
    <g fill="#f2e8d5" font-family="'Nanum Myeongjo', 'AppleMyungjo', serif" font-size="34" text-anchor="middle">
      <text x="70" y="52">제갈</text>
      <text x="70" y="90">공명</text>
    </g>
  </g>
</svg>
